name: Checks

# Runs on every push to the deploy branch and every pull request. Pushes to
# claude/egypt-eye-travel-website-fckb5t go straight to the live site, so
# these checks are the last gate before customers see a change.
#
# The content check is the reason this workflow exists. Two content-drift
# failures shipped to production undetected because neither breaks a build
# nor looks wrong on screen:
#   - the Explore Egypt map told visitors "we don't run tours here yet"
#     about eleven places we actively sell;
#   - eighteen tours were reachable from no destination page at all.
# Both are pure data mistakes in src/content/*.ts, so typecheck and lint
# both pass happily. Only check:destinations catches them.
#
# `next build` is deliberately not run here: it fetches from Sanity, so a
# CMS outage or a network hiccup would fail an otherwise-good commit, and
# the deploy platform builds every push anyway.

on:
  push:
    branches: [claude/egypt-eye-travel-website-fckb5t]
  pull_request:
  workflow_dispatch: {}

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Matches "engines": { "node": "24.x" } in package.json.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Every step below uses `if: ${{ !cancelled() }}` so one failure still
      # reports the others — a red build shows every problem to fix in one
      # pass instead of one per push.
      - name: Destination coverage
        if: ${{ !cancelled() }}
        run: npm run check:destinations

      - name: Story cover photos
        if: ${{ !cancelled() }}
        run: npm run check:stories

      # A required field that Sanity returns as null, or that the projection
      # never selected, crashes a page the moment a Studio document exists —
      # which is how production lost two days. Every other check here reads
      # the local content files, which are complete by construction, so this
      # is the only one that sees it.
      - name: Sanity content shape
        if: ${{ !cancelled() }}
        run: npm run check:shape

      # The migration writes to the live Sanity dataset and cannot be run
      # outside production, so what it would overwrite is asserted here.
      - name: Migration plan
        if: ${{ !cancelled() }}
        run: npm run check:migration

      # The deposit flow's promises — no payment event may confirm a booking,
      # and a product with no deposit figure shows no button.
      - name: Booking rules
        if: ${{ !cancelled() }}
        run: npm run check:booking

      # PayPal cannot be reached from CI, which is the reason this exists: the
      # rules that decide whether a customer's money moved have to be provable
      # without a network. Money compared in whole cents, an unreadable setting
      # falling back to sandbox and CAPTURE rather than to live and an unwatched
      # hold, and an unverified webhook always refused.
      - name: PayPal rules
        if: ${{ !cancelled() }}
        run: npm run check:paypal

      # A dev-only CSP relaxation that leaked into production would hand an
      # attacker the ability to execute injected strings. This evaluates the
      # real next.config.ts under every NODE_ENV. It also asserts PayPal's four
      # origins are allowed by name — without them the checkout buttons fail
      # silently and deposits simply stop being paid.
      - name: Content-Security-Policy
        if: ${{ !cancelled() }}
        run: npm run check:csp

      # Weekly Trip slugs are referenced by trip_departures rows in Supabase,
      # which no typecheck can see. Renaming one silently orphans every
      # scheduled departure, so the slugs are pinned and this is what notices.
      - name: Weekly Trips catalogue
        if: ${{ !cancelled() }}
        run: npm run check:trips

      # The review rules are legal ones — excerpting third-party reviews
      # rather than republishing them, keeping imported ratings out of
      # structured data, dropping photos we don't have rights to. All of it
      # renders fine when broken, so it is asserted instead.
      - name: Review policy
        if: ${{ !cancelled() }}
        run: npm run check:reviews

      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npx tsc --noEmit
